name: Tests

# Lance la suite de tests sur chaque PR vers main (et sur main après fusion).
# Sert de verrou : une fois la branche protégée, une PR ne peut fusionner que si ce job passe.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
