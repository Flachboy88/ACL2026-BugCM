# PostgreSQL database for the agenda application.
# Started automatically by "npm start" (see "prestart" in package.json).
# Values come from the .env file if it exists, otherwise the defaults below are used.

name: agenda-bugcm

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-agenda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agenda}
      POSTGRES_DB: ${DB_NAME:-agenda}
    ports:
      # Only reachable from this machine (the Node server runs on the same machine)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # The data is kept in this volume, so it survives restarts
      - agenda-data:/var/lib/postgresql/data
    healthcheck:
      # The database is "healthy" when it accepts network connections
      # (-h localhost: during its very first start, PostgreSQL is not reachable by network yet)
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  agenda-data:
